name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q

  # The release artifact is a thing nobody on this machine ever runs: the tests in
  # the job above run against the checkout, where every helper file and every
  # static asset is present by construction. Both artifacts are checked here
  # because both were broken, and the checkout stayed green through all of it:
  #   - the sdist ships the suite (setuptools picks up tests/test*.py on its own)
  #     but shipped none of what that suite imports or reads: no conftest.py, no
  #     shared fakes, no probes/ fixtures. 39 modules, none collectable.
  #   - the web UI is the one non-Python file in the package and nothing declared
  #     it, so the wheel -- the thing pip actually installs -- served a 404 for
  #     every user, while the suite passed against the file on disk.
  # Found by unpacking a release and running it. Both checks live in the repo that
  # can fix what they find.
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build

      - name: build both artifacts
        run: python -m build

      - name: the wheel carries the web UI
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --quiet "$GITHUB_WORKSPACE"/dist/*.whl

          # Read the archive's own index: nothing about this can resolve to the
          # checkout by accident.
          python - <<'PY'
          import glob
          import zipfile

          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert "autoforge/web/static/index.html" in names, f"web UI missing from {whl}"
          print("  in the archive:", whl)
          PY

          # And resolvable through the install -- run from OUTSIDE the checkout.
          # Run this from the repo root and `import autoforge` finds ./autoforge
          # on sys.path instead of the wheel, which is how this check passed on a
          # wheel that had no UI in it at all.
          cd /tmp
          /tmp/wheelcheck/bin/python - <<'PY'
          import pathlib
          from importlib.resources import files

          import autoforge

          where = str(pathlib.Path(autoforge.__file__).resolve())
          assert "site-packages" in where or "wheelcheck" in where, where
          ui = files("autoforge.web") / "static" / "index.html"
          assert ui.is_file(), f"web UI missing from the install: {ui}"
          print("  imported from:", where)
          print("  UI in the install:", ui)
          PY
          /tmp/wheelcheck/bin/python -m autoforge --version

      - name: the sdist carries what its own suite imports
        run: |
          tarball=$(ls dist/*.tar.gz)
          echo "checking $tarball"
          # Listed once into a variable: `tar tzf | grep -q` lets grep exit on the
          # first match, tar gets SIGPIPE and prints "tar: stdout: write error"
          # next to a passing check.
          listing=$(tar tzf "$tarball")
          for f in tests/conftest.py tests/_terminal.py tests/mcp_server_fixture.py \
                   probes/raw_generator_reply_clean.txt autoforge/web/static/index.html; do
            case "$listing" in
              *"/$f"*) echo "  present: $f" ;;
              *) echo "::error::$tarball is missing $f"; exit 1 ;;
            esac
          done

      # Named the same way a reader would get it: unpack the tarball, install
      # from it, run what is inside it. Nothing from the checkout is on the path.
      - name: the unpacked sdist passes its own suite
        run: |
          tarball=$(ls dist/*.tar.gz)
          mkdir -p /tmp/artifact && cd /tmp/artifact
          tar xzf "$GITHUB_WORKSPACE/$tarball"
          cd autoforge_agent-*
          python -m pip install -e ".[dev]"
          python -m pytest tests -q -p no:cacheprovider
