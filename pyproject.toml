[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge"
version = "0.4.0"
description = "Agent framework with verifiable self-made tools (the forge pipeline)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhang Yangyi" }]
dependencies = ["requests>=2.28"]

[project.scripts]
autoforge = "autoforge.cli:main"
auto = "autoforge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist"]

[tool.setuptools.packages.find]
include = ["autoforge*"]
