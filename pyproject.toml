[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoforge-agent"
version = "0.4.3"
description = "Agent framework with verifiable self-made tools (the forge pipeline)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhang Yangyi" }]
keywords = ["agents", "llm", "tools", "self-improvement", "verification"]
dependencies = ["requests>=2.28"]

[project.scripts]
autoforge = "autoforge.cli:main"
auto = "autoforge.cli:main"

[project.optional-dependencies]
# The embedded market console (`auto market`). Listed as an extra rather than as
# runtime deps because most users never serve a shelf, and the market's own code
# is only imported inside `autoforge.embedded`.
market = ["pydantic>=2.0", "fastapi>=0.110", "uvicorn>=0.27"]
# pyyaml is here, not in the runtime deps: reading a YAML config is optional at
# runtime (the loader says "pip install pyyaml" when it is absent, and a test
# drives exactly that path by monkeypatching the import). But the test suite
# reads a real YAML file to prove the happy path, so a machine without pyyaml
# fails two tests -- which is what a fresh CI runner turned out to be. Declaring
# it keeps the suite testing what it claims instead of testing this laptop.
dev = ["pytest>=7", "pytest-xdist", "pyyaml"]

[tool.setuptools.packages.find]
# `toolmarket` ships inside this distribution: the market is not a dependency a
# user has to find and install, it is a directory in this repo (joined by git
# subtree, history intact) and a directory in this wheel. `autoforge.embedded`
# is the only module that puts it on sys.path.
include = ["autoforge*", "toolmarket*"]

[tool.setuptools.package-data]
# The web UI is one static file, and it is the only thing in this package that is
# not Python. Nothing declared it, so neither the wheel nor the sdist carried it:
# every install served a missing index.html while the suite stayed green in a
# checkout, where the file happens to be on disk. A test that serves the UI from
# a built wheel is what keeps this declared.
"autoforge.web" = ["static/*"]
