{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tool-market.postgresHost" . }}
  labels:
    {{- include "tool-market.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  # Recreate, not RollingUpdate: two Postgres pods cannot both hold the same
  # PVC, and a rolling update would leave the new pod unschedulable while the
  # old one drains -- which reads as a stuck deploy rather than a storage
  # conflict.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tool-market.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "tool-market.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tool-market.substrateSecret" . }}
                  key: password
            - name: PGDATA
              # A subdirectory of the mount: initdb refuses to run in a volume
              # that already contains files, which is exactly what a bound PVC
              # may hand a first-time pod.
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            # `-U` and `-d` are not optional, for the same reason compose says
            # so: without them this runs as the superuser against the default
            # database and reports ready while the app's database does not
            # exist yet.
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tool-market.postgresHost" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tool-market.postgresHost" . }}
  labels:
    {{- include "tool-market.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # ClusterIP and no Ingress: the database is reachable from inside the
  # release and nowhere else. Publishing it would be a decision, not a
  # default.
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "tool-market.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- if .Values.postgres.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "tool-market.postgresHost" . }}
  labels:
    {{- include "tool-market.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.postgres.persistence.storageClass }}
  storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size | quote }}
{{- end }}
{{- end }}
