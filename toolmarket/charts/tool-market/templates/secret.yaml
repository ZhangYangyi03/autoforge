{{- /* One Secret holds everything the app connects with, so the password is
       generated exactly once and the DSN is built from the same value the
       Postgres pod is given. Two Secrets would be two chances for them to
       disagree, and that disagreement surfaces as "password authentication
       failed" from a container that looks correctly configured.

       On upgrade the existing password is read back rather than regenerated:
       randAlphaNum is evaluated on every render, so without this guard every
       `helm upgrade` would rotate the password out from under a running
       database. */ -}}
{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabase.dsn) -}}
{{- fail "postgres.enabled=false requires externalDatabase.dsn" -}}
{{- end -}}
{{- $name := include "tool-market.substrateSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if and $existing (index $existing.data "password") -}}
{{- $password = index $existing.data "password" | b64dec -}}
{{- else if .Values.postgres.password -}}
{{- $password = .Values.postgres.password -}}
{{- else if .Values.postgres.enabled -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- $dsn := "" -}}
{{- if .Values.postgres.enabled -}}
{{- $dsn = printf "postgresql://%s:%s@%s:5432/%s" .Values.postgres.user $password (include "tool-market.postgresHost" .) .Values.postgres.database -}}
{{- else -}}
{{- $dsn = .Values.externalDatabase.dsn -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tool-market.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.postgres.enabled }}
  password: {{ $password | b64enc | quote }}
  {{- end }}
  dsn: {{ $dsn | b64enc | quote }}
  redisUrl: {{ include "tool-market.redis.url" . | b64enc | quote }}
  brokerUrl: {{ include "tool-market.redis.brokerUrl" . | b64enc | quote }}
  resultBackendUrl: {{ include "tool-market.redis.resultBackendUrl" . | b64enc | quote }}
